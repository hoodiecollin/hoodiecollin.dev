# Deploy — build in GitHub Actions, deploy PREBUILT to Vercel.
#
# Vercel serves; it does NOT build. `vercel build` runs `next build` on THIS GH
# runner (our minutes, not Vercel's) and compiles vercel.json's `/relay` PostHog
# reverse-proxy rewrites + security headers into the deployed output. `vercel
# deploy --prebuilt` uploads that output without re-running the build on Vercel.
#
#   vercel pull   --environment=<preview|production>   # fetch project settings/env
#   vercel build  [--prod]                             # next build here (GH runner)
#   vercel deploy --prebuilt [--prod]                  # upload the prebuilt output
#
# push to main → production; pull_request → preview. The `prebuild` search-index
# step runs automatically as the `next build` lifecycle hook.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID — link the CLI to the project.
#   NEXT_PUBLIC_POSTHOG_KEY — publishable (phc_) key; injected at BUILD time so
#     Next inlines it. It lives in GH (not Vercel env) because the build runs
#     here, not on Vercel.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy per ref; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to post the preview URL on PRs

# The Vercel CLI reads these to resolve the project without a committed .vercel/project.json.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: build & deploy (${{ github.event_name == 'push' && 'production' || 'preview' }})
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Cache ONLY bun's download cache (deps), keyed on the lockfile. We
      # deliberately do NOT cache .next/cache: restoring Next's persistent
      # webpack cache across commits can serve stale compiled CSS. The
      # static-export build is fast, so recompiling fresh every run is the right
      # trade — correctness over a marginal cache hit.
      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Node/npm are preinstalled on the runner; install the Vercel CLI globally.
      # `vercel build` still uses bun for the project itself (it detects bun.lock).
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod"    >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag="       >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # `next build` runs here — including the `prebuild` search-index step.
      # NEXT_PUBLIC_POSTHOG_KEY is inlined into the client bundle at this step.
      - name: Build (on the GH runner)
        run: vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed (${{ steps.target.outputs.env }})"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Surface the preview URL on the PR so it's one click to review.
      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          gh pr comment "$PR" --body "🚀 Preview: ${{ steps.deploy.outputs.url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
